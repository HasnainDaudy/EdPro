services:
  edpro:
    build:
      context: .
      dockerfile: Dockerfile
    image: edpro-app:latest
    container_name: edpro_platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=change-this-to-a-very-secure-random-key-in-production
      - AI_PROVIDER=mock
    volumes:
      - edpro_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  edpro_data:
    driver: local
